name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run build and unit tests
        run: npm run test:ci 2>&1 | tee test-results.log

      - name: Run Electron Playwright smoke tests
        run: xvfb-run --auto-servernum npm run test:e2e 2>&1 | tee e2e-results.log

      - name: Upload generated test media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-test-media
          path: assets/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.log
            e2e-results.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
